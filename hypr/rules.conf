# Floating term
windowrule {
  name = scratchpad
  match:class = kitty
  match:title = scratchpad

  workspace = special silent
  center = true
  float = true
}

# Trans
windowrule {
  name = trans
  match:class = firefox-developer-edition
  match:class = jetbrains-idea
  match:class = code-oss
  
  opacity = 0.95
}

# Persistent workspaces
workspace = 1, persistent:true, monitor:eDP-1
workspace = 2, persistent:true, monitor:eDP-1
workspace = 3, persistent:true, monitor:eDP-1, default:true
workspace = 4, persistent:true, monitor:eDP-1
workspace = 5, persistent:true, monitor:eDP-1

workspace = 11, persistent:true, monitor:DP-2
workspace = 12, persistent:true, monitor:DP-2
workspace = 13, persistent:true, monitor:DP-2, default:true
workspace = 14, persistent:true, monitor:DP-2
workspace = 15, persistent:true, monitor:DP-2

layerrule = blur true, match:title eww-bar
layerrule = blur true, match:title eww-notification-daemon

workspace = special:scratchpad, on-created-empty:foot
